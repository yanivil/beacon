# Version catalog: the single place where dependency versions live.
[versions]
agp = "9.5.1"
# The Compose compiler plugin's version, which is also the Kotlin version:
# AGP 9.5.1's built-in Kotlin is 2.2.10, and Gradle takes the higher of the
# two, so the compiler and this plugin match as long as this is at least
# AGP's own version. It also sets the kotlin-stdlib the app ships. When
# changing AGP or this, check `./gradlew buildEnvironment` shows one
# kotlin-gradle-plugin version.
kotlin = "2.4.21"
activityCompose = "1.13.0"
datastore = "1.3.0"
# The next four need compileSdk 37: their AAR metadata says
# minCompileSdk=37. The owner raised compileSdk to 37 in CLAUDE.md for them
# on 11 November 2026, so they are at their newest releases. A later bump
# that asks for a higher compileSdk fails checkDebugAarMetadata, and needs
# the owner's say again.
composeBom = "2026.09.00"
composeUi = "1.12.1"
lifecycle = "2.11.0"
coreKtx = "1.19.1"
junit = "4.13.2"
robolectric = "4.17"
androidxTest = "1.7.0"
androidxTestExtJunit = "1.3.0"
coroutinesTest = "1.11.0"
glance = "1.2.0"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material-ripple = { module = "androidx.compose.material:material-ripple" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "composeUi" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "composeUi" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTest" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutinesTest" }
glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
glance-appwidget-testing = { module = "androidx.glance:glance-appwidget-testing", version.ref = "glance" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
